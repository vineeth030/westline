<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Westine Creative</title>
  <meta name="description" content="Let's create something meaningful. Reach out to Westine Creative to explore how thoughtful design can help your business grow." />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            ivory: '#f7f4ee',
            paper: '#fbf9f5',
            ink: '#1f1d1a',
            stone: '#6b665d',
            clay: '#b07d56',
            'clay-dark': '#8f6543',
          },
        },
      },
    };
  </script>

  <style>
    .tracking-luxe { letter-spacing: 0.28em; }
    .nav-link { position: relative; }
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      height: 1px;
      width: 0;
      background-color: #b07d56;
      transition: width 0.35s ease;
    }
    .nav-link:hover::after { width: 100%; }
    .nav-link.active::after { width: 100%; }
  </style>
</head>

<body class="bg-ivory text-ink font-sans antialiased selection:bg-clay/20">
  <div class="relative flex min-h-screen flex-col overflow-hidden">

    <!-- Decorative geometry -->
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="absolute -bottom-40 -right-32 h-[32rem] w-[32rem] rounded-full bg-gradient-to-tl from-clay/15 to-transparent blur-2xl"></div>
      <div class="absolute -top-32 -left-24 h-[26rem] w-[26rem] rounded-full bg-gradient-to-br from-stone/10 to-transparent blur-2xl"></div>
      <svg class="absolute bottom-20 left-16 hidden h-28 w-28 text-clay/25 lg:block" viewBox="0 0 100 100" fill="none">
        <polygon points="50,6 94,94 6,94" stroke="currentColor" stroke-width="0.6" />
      </svg>
      <div class="absolute left-1/4 top-20 hidden h-px w-40 rotate-12 bg-gradient-to-r from-transparent via-ink/15 to-transparent lg:block"></div>
    </div>

    <!-- Navigation -->
    <header class="relative z-20">
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-6 lg:px-10">
        <a href="index.html" class="flex items-baseline gap-2">
          <span class="font-serif text-xl font-medium tracking-tight text-ink">Westine</span>
          <span class="text-xs font-medium uppercase tracking-luxe text-clay">Creative</span>
        </a>
        <div class="flex items-center gap-8 text-sm font-medium text-stone">
          <a href="index.html" class="nav-link transition-colors hover:text-ink">Home</a>
          <a href="about.html" class="nav-link transition-colors hover:text-ink">About</a>
          <a href="contact.html" class="nav-link active text-ink transition-colors hover:text-ink">Contact</a>
        </div>
      </nav>
    </header>

    <!-- Main content -->
    <main class="relative z-10 flex flex-1 items-center px-6 py-10 lg:px-10">
      <div class="mx-auto w-full max-w-xl text-center">
        <p class="mb-6 text-xs font-medium uppercase tracking-luxe text-clay">Get in Touch</p>
        <h1 class="font-serif text-4xl font-light leading-tight text-ink sm:text-5xl lg:text-6xl">
          Let's Create<br /><span class="italic text-clay">Something Meaningful</span>
        </h1>

        <p class="mx-auto mt-8 max-w-md text-lg font-light leading-relaxed text-stone">
          We'd love to hear about your business and explore how thoughtful
          design can help you grow.
        </p>

        <!-- Contact detail -->
        <div class="mx-auto mt-10 inline-flex flex-col items-center gap-2">
          <span class="text-xs font-medium uppercase tracking-luxe text-stone">Email Us</span>
          <a href="mailto:hello@westinecreative.com"
             class="font-serif text-xl text-ink transition-colors duration-300 hover:text-clay sm:text-2xl">
            teamwestlinecreative@gmail.com
          </a>
        </div>

        <div class="mt-12">
          <a href="mailto:hello@westinecreative.com"
             class="group inline-flex items-center gap-2 rounded-full bg-ink px-8 py-4 text-sm font-medium text-paper transition-all duration-300 hover:bg-clay-dark hover:shadow-lg hover:shadow-clay/20">
            Start a Conversation
            <span class="transition-transform duration-300 group-hover:translate-x-1">&rarr;</span>
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 px-6 pb-6 lg:px-10">
      <div class="mx-auto flex max-w-6xl items-center justify-between text-xs text-stone">
        <span>&copy; 2026 Westine Creative</span>
        <span class="hidden sm:block">Design that means business.</span>
      </div>
    </footer>

  </div>
</body>
</html>
